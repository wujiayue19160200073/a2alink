name: codeql

# 一个讲"数据出域风险"的项目，自己的代码被静态审计一遍是应该的。
# 这类扫描的价值不在于零告警，而在于**新增告警会出现在 PR 上**，
# 让"这次改动引入了危险写法"变成一个当场可见的事实。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一凌晨扫一次：代码没动，但查询规则会更新。
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write   # 写 code scanning 结果，缺这行会静默失败
  actions: read

jobs:
  analyze:
    name: 静态分析 (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # 刻意不写 queries：不指定就是默认查询集。
          # 之前写死 `queries: default` 导致 database init 直接 fatal error ——
          # 这个选项只在挂自定义查询包（如 security-extended）时才该出现，
          # "default" 会被当成一个包名去解析然后找不到。
          # 也不建议一上来就用 security-extended：几百条风格告警会让人整套忽略。

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
